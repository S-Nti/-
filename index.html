<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>未来超跑 · 3D拆解实验室</title>
<style>
:root{--cyan:#00e5ff;--cyan-soft:rgba(0,229,255,.55);--magenta:#ff2d8a;--bg:#020309;--panel:rgba(7,18,28,.78);--line:rgba(0,229,255,.22);--text:#d9fbff;--muted:#7fa8b5;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 800px at 50% 120%,rgba(0,229,255,.14),transparent 60%),radial-gradient(900px 600px at 85% -10%,rgba(255,45,138,.12),transparent 55%),var(--bg);}
#app{position:fixed;inset:0;}
#scene-container{position:absolute;inset:0;z-index:1;}
#scene-container canvas{display:block;outline:none;}
#scene-container .css2d{position:absolute;top:0;left:0;pointer-events:none;}
body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);background-size:42px 42px;-webkit-mask-image:radial-gradient(ellipse at center,transparent 0%,#000 68%,transparent 100%);mask-image:radial-gradient(ellipse at center,transparent 0%,#000 68%,transparent 100%);}
#scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;opacity:.55;}
.corner{position:absolute;width:74px;height:74px;z-index:4;pointer-events:none;border:1px solid var(--cyan-soft);opacity:.8;}
.corner.tl{left:18px;top:18px;border-right:0;border-bottom:0;}
.corner.tr{right:18px;top:18px;border-left:0;border-bottom:0;}
.corner.bl{left:18px;bottom:18px;border-right:0;border-top:0;}
.corner.br{right:18px;bottom:18px;border-left:0;border-top:0;}
.brand{position:absolute;left:34px;top:30px;z-index:5;pointer-events:none;max-width:430px;}
.brand .kicker{font-size:11px;letter-spacing:.42em;color:var(--cyan);text-transform:uppercase;text-shadow:0 0 12px var(--cyan);}
.brand h1{margin-top:8px;font-size:30px;font-weight:700;letter-spacing:.04em;background:linear-gradient(90deg,#eaffff,#7cf5ff 55%,#ff8cc1);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(0,229,255,.35));}
.brand p{margin-top:8px;color:var(--muted);font-size:13px;letter-spacing:.18em;}
.panel{position:absolute;right:24px;top:24px;width:282px;z-index:5;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(0,229,255,.045);}
.panel-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;letter-spacing:.32em;color:#8fd8e6;}
.panel-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);}
.panel-title i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat{background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.14);border-radius:10px;padding:8px 6px;text-align:center;}
.stat label{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);}
.stat b{display:block;margin-top:4px;font-size:15px;color:#eaffff;}
.range-row{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;color:var(--muted);margin:12px 0 6px;}
.range-row b{color:var(--cyan);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),rgba(0,229,255,.12));outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#eaffff;border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan);cursor:pointer;}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px;}
.btn{font-family:inherit;font-size:12px;letter-spacing:.1em;color:#c8f7ff;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.22);border-radius:10px;padding:10px 8px;cursor:pointer;transition:.2s;}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.22);color:#fff;}
.btn.primary{grid-column:1 / -1;background:linear-gradient(90deg,rgba(0,229,255,.22),rgba(255,45,138,.18));border-color:rgba(255,255,255,.28);color:#fff;}
.btn.active{border-color:var(--magenta);color:#ffd7ea;box-shadow:0 0 16px rgba(255,45,138,.28);background:rgba(255,45,138,.12);}
.footnote{margin-top:13px;font-size:10px;letter-spacing:.16em;color:#4d7a88;text-align:center;}
.info{position:absolute;left:28px;bottom:26px;z-index:5;max-width:360px;background:rgba(5,14,20,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:12px;padding:13px 15px;box-shadow:0 14px 40px rgba(0,0,0,.35);}
.info-label{font-size:10px;letter-spacing:.32em;color:var(--muted);}
.part-name{margin-top:5px;font-size:18px;color:#fff;text-shadow:0 0 12px rgba(0,229,255,.45);}
.part-desc{margin-top:5px;font-size:12px;line-height:1.5;color:#9ec8d4;min-height:18px;}
.hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;font-size:11px;letter-spacing:.22em;color:rgba(127,168,181,.72);pointer-events:none;}
.part-label{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:11px;letter-spacing:.14em;color:#c9fbff;background:rgba(0,18,28,.62);border:1px solid rgba(0,229,255,.42);border-radius:12px;padding:3px 9px;white-space:nowrap;text-shadow:0 0 8px rgba(0,229,255,.8);backdrop-filter:blur(4px);pointer-events:none;}
#loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s ease;}
#loader.hidden{opacity:0;pointer-events:none;}
.ring{width:62px;height:62px;border-radius:50%;border:2px solid rgba(0,229,255,.14);border-top-color:var(--cyan);animation:spin 1s linear infinite;box-shadow:0 0 28px rgba(0,229,255,.18);}
@keyframes spin{to{transform:rotate(360deg);}}
#loader span{font-size:12px;letter-spacing:.42em;color:var(--muted);}
@media (max-width:760px){
.panel{right:10px;top:10px;width:230px;padding:13px;}
.brand{left:20px;top:20px;}
.brand h1{font-size:22px;}
.info{left:14px;bottom:14px;max-width:280px;}
.hint{display:none;}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="scene-container"></div>
  <div id="scanlines"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <header class="brand">
    <div class="kicker">Hyperion // X-1 Concept</div>
    <h1>未来超跑 · 3D拆解实验室</h1>
    <p>Three.js 全交互零部件爆炸视图</p>
  </header>
  <aside class="panel">
    <div class="panel-title"><i></i><span>CONTROL DECK</span></div>
    <div class="stat-grid">
      <div class="stat"><label>零部件</label><b id="stat-parts">0</b></div>
      <div class="stat"><label>三角面</label><b id="stat-tris">0</b></div>
      <div class="stat"><label>FPS</label><b id="stat-fps">0</b></div>
    </div>
    <div class="range-row"><span>拆解强度</span><b id="explode-value">0%</b></div>
    <input id="slider-explode" type="range" min="0" max="100" value="0">
    <div class="range-row"><span>旋转速度</span><b id="speed-value">1.0x</b></div>
    <input id="slider-speed" type="range" min="0" max="2.5" step="0.05" value="1.0">
    <div class="btn-grid">
      <button id="btn-explode" class="btn primary">开始拆解</button>
      <button id="btn-auto" class="btn active">自动旋转</button>
      <button id="btn-wire" class="btn">线框模式</button>
      <button id="btn-labels" class="btn active">显示标签</button>
      <button id="btn-reset" class="btn">重置视角</button>
    </div>
    <p class="footnote">点击零件高亮查看 · 滚轮缩放 · 右键平移</p>
  </aside>
  <div class="info">
    <div class="info-label">CURRENT COMPONENT</div>
    <div class="part-name" id="part-name">悬停零件查看信息</div>
    <div class="part-desc" id="part-desc">将鼠标移动到车体任意零件上，获取结构与材料说明。</div>
  </div>
  <div class="hint">左键旋转 / 右键平移 / 滚轮缩放</div>
</div>
<div id="loader"><div class="ring"></div><span>INITIALIZING VISUAL ENGINE</span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040a, 0.022);

const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 120);
camera.position.set(7.4, 4.2, 10.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(container.clientWidth, container.clientHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
labelRenderer.domElement.style.zIndex = '2';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.8;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.86;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;

const ambient = new THREE.AmbientLight(0x3d5a70, 0.55);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x8edcff, 0x02101a, 0.9);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(7, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0002;
scene.add(key);
const rimLight = new THREE.PointLight(0x00e5ff, 38, 16, 2);
rimLight.position.set(-5, 3.5, -6);
scene.add(rimLight);
const fill = new THREE.PointLight(0xff2d8a, 22, 14, 2);
fill.position.set(5, 2.5, 5);
scene.add(fill);
const under = new THREE.PointLight(0x00e5ff, 18, 8, 2);
under.position.set(0, -0.6, 0);
scene.add(under);

const car = new THREE.Group();
car.position.y = 0;
scene.add(car);

const parts = [];
const partMeshes = [];
const nameToGroup = new Map();
const partMeta = {
  '车身外壳':'碳纤维单体壳，融合宽体翼子板与主动空气动力学曲面。',
  '碳纤维底盘':'低重心碳纤维浴盆式底盘，集成前分流器与后扩散器。',
  '前引擎盖':'轻量化主动散热引擎盖，内置可变进气风道。',
  '左侧车门':'剪刀式碳纤维车门，集成侧向碰撞吸能结构。',
  '右侧车门':'剪刀式碳纤维车门，集成侧向碰撞吸能结构。',
  '全景座舱玻璃':'电致变色全景天幕与流线型前后风挡。',
  '驾驶座舱':'双座竞技座舱，包含全息仪表与碳纤维桶椅。',
  'V8 动力引擎':'双涡轮增压 V8 混合动力单元，中央后置布局。',
  '主动式尾翼':'电控主动尾翼，根据速度与制动姿态实时调节。',
  '矩阵激光大灯':'自适应矩阵激光大灯，提供超远距照明与数字投影。',
  '贯穿式尾灯':'贯穿式 LED 尾灯组，集成动态转向信号。',
  '左前轮毂':'锻造镁合金轮毂搭配碳陶瓷刹车系统。',
  '右前轮毂':'锻造镁合金轮毂搭配碳陶瓷刹车系统。',
  '左后轮毂':'锻造镁合金轮毂搭配碳陶瓷刹车系统。',
  '右后轮毂':'锻造镁合金轮毂搭配碳陶瓷刹车系统。'
};

const mat = {
  body: new THREE.MeshStandardMaterial({ color: 0x161c27, metalness: 0.9, roughness: 0.24 }),
  bodyDark: new THREE.MeshStandardMaterial({ color: 0x0b0f16, metalness: 0.82, roughness: 0.34 }),
  carbon: new THREE.MeshStandardMaterial({ color: 0x080b10, metalness: 0.62, roughness: 0.5 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xa9dcff, metalness: 0.18, roughness: 0.06, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }),
  rim: new THREE.MeshStandardMaterial({ color: 0xdfe9f5, metalness: 0.95, roughness: 0.16 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x040507, metalness: 0.2, roughness: 0.9 }),
  brake: new THREE.MeshStandardMaterial({ color: 0xff2d55, metalness: 0.75, roughness: 0.3, emissive: 0xff2d55, emissiveIntensity: 0.25 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x11161f, metalness: 0.5, roughness: 0.7 }),
  cyan: new THREE.MeshStandardMaterial({ color: 0x00e5ff, metalness: 0.25, roughness: 0.3, emissive: 0x00e5ff, emissiveIntensity: 1.3 }),
  magenta: new THREE.MeshStandardMaterial({ color: 0xff2d8a, metalness: 0.25, roughness: 0.3, emissive: 0xff2d8a, emissiveIntensity: 1.3 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf6fbff, metalness: 0.4, roughness: 0.22, emissive: 0xffffff, emissiveIntensity: 0.9 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xb9d3e0, metalness: 0.9, roughness: 0.2 })
};

function box(w, h, d, m, sx = 1, sy = 1, sz = 1) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.05), m);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createLabel(name) {
  const el = document.createElement('div');
  el.className = 'part-label';
  el.textContent = name;
  return new CSS2DObject(el);
}

function registerPart(name, group, offset, labelPos) {
  group.userData.partName = name;
  group.userData.basePos = group.position.clone();
  group.userData.explodeOffset = offset.clone();
  group.traverse((o) => {
    if (o.isMesh) {
      o.userData.partName = name;
      o.castShadow = true;
      o.receiveShadow = true;
      partMeshes.push(o);
    }
  });
  if (labelPos) {
    const label = createLabel(name);
    label.position.copy(labelPos);
    group.add(label);
  }
  parts.push(group);
  nameToGroup.set(name, group);
  car.add(group);
  return group;
}

// ---------- Chassis ----------
const chassis = new THREE.Group();
const chassisFloor = box(1.92, 0.22, 4.75, mat.carbon);
chassisFloor.position.set(0, 0.06, 0.05);
chassis.add(chassisFloor);
const sillL = box(0.24, 0.2, 4.15, mat.bodyDark);
sillL.position.set(-1.0, 0.17, 0.05);
chassis.add(sillL);
const sillR = box(0.24, 0.2, 4.15, mat.bodyDark);
sillR.position.set(1.0, 0.17, 0.05);
chassis.add(sillR);
const splitter = box(1.95, 0.1, 0.55, mat.carbon);
splitter.position.set(0, 0.13, 2.72);
chassis.add(splitter);
const diffuser = box(1.95, 0.16, 0.62, mat.bodyDark);
diffuser.position.set(0, 0.16, -2.55);
chassis.add(diffuser);
for (let i = 0; i < 4; i++) {
  const fin = box(0.05, 0.18, 1.35, mat.carbon);
  fin.position.set(-0.75 + i * 0.5, 0.16, -1.55);
  chassis.add(fin);
}
const underL = box(1.78, 0.03, 3.4, mat.cyan);
underL.position.set(0, 0.05, 0.05);
chassis.add(underL);
registerPart('碳纤维底盘', chassis, new THREE.Vector3(0, -0.9, 0), new THREE.Vector3(0, -0.35, 0));

// ---------- Body shell ----------
const body = new THREE.Group();
const tub = box(1.95, 0.62, 4.55, mat.body);
tub.position.set(0, 0.62, 0.05);
body.add(tub);
const nose = box(1.7, 0.38, 1.05, mat.body);
nose.position.set(0, 0.66, 2.42);
nose.rotation.x = -0.07;
body.add(nose);
const tail = box(1.95, 0.5, 1.25, mat.body);
tail.position.set(0, 0.68, -2.05);
body.add(tail);
const spine = box(0.72, 0.18, 2.4, mat.bodyDark);
spine.position.set(0, 0.86, -0.35);
body.add(spine);
const fenderFL = box(0.3, 0.32, 1.0, mat.body);
fenderFL.position.set(-1.0, 0.74, 1.55);
body.add(fenderFL);
const fenderFR = box(0.3, 0.32, 1.0, mat.body);
fenderFR.position.set(1.0, 0.74, 1.55);
body.add(fenderFR);
const fenderRL = box(0.32, 0.38, 1.15, mat.body);
fenderRL.position.set(-1.0, 0.76, -1.5);
body.add(fenderRL);
const fenderRR = box(0.32, 0.38, 1.15, mat.body);
fenderRR.position.set(1.0, 0.76, -1.5);
body.add(fenderRR);
const sideIntakeL = box(0.08, 0.22, 0.9, mat.cyan);
sideIntakeL.position.set(-1.02, 0.66, -1.1);
body.add(sideIntakeL);
const sideIntakeR = box(0.08, 0.22, 0.9, mat.cyan);
sideIntakeR.position.set(1.02, 0.66, -1.1);
body.add(sideIntakeR);
registerPart('车身外壳', body, new THREE.Vector3(0, 0.95, 0), new THREE.Vector3(0, 1.35, 0));

// ---------- Hood ----------
const hood = new THREE.Group();
const hoodTop = box(1.58, 0.12, 1.35, mat.body);
hoodTop.position.set(0, 0.97, 1.76);
hoodTop.rotation.x = -0.03;
hood.add(hoodTop);
const ventL = box(0.34, 0.06, 0.55, mat.bodyDark);
ventL.position.set(-0.32, 1.04, 1.9);
hood.add(ventL);
const ventR = box(0.34, 0.06, 0.55, mat.bodyDark);
ventR.position.set(0.32, 1.04, 1.9);
hood.add(ventR);
const hoodGlow = box(1.45, 0.02, 0.05, mat.cyan);
hoodGlow.position.set(0, 1.04, 2.46);
hood.add(hoodGlow);
registerPart('前引擎盖', hood, new THREE.Vector3(0, 1.15, 1.2), new THREE.Vector3(0, 0.3, 0));

// ---------- Doors ----------
function buildDoor(sign, name, offset, label) {
  const door = new THREE.Group();
  const panel = box(0.18, 0.42, 1.9, mat.body);
  panel.position.set(sign * 1.02, 0.78, -0.18);
  door.add(panel);
  const sideGlass = new THREE.Mesh(new RoundedBoxGeometry(0.1, 0.28, 1.05, 2, 0.05), mat.glass);
  sideGlass.position.set(sign * 1.06, 1.04, -0.18);
  door.add(sideGlass);
  const handle = box(0.05, 0.03, 0.28, mat.chrome);
  handle.position.set(sign * 1.12, 0.82, 0.35);
  door.add(handle);
  const intake = box(0.05, 0.18, 0.6, mat.cyan);
  intake.position.set(sign * 1.12, 0.62, -1.05);
  door.add(intake);
  registerPart(name, door, offset, label);
  return door;
}
buildDoor(-1, '左侧车门', new THREE.Vector3(-1.95, 0.25, 0.2), new THREE.Vector3(0, 0.5, 0));
buildDoor(1, '右侧车门', new THREE.Vector3(1.95, 0.25, 0.2), new THREE.Vector3(0, 0.5, 0));

// ---------- Glass canopy ----------
const glass = new THREE.Group();

function buildWheel(x, z, name, offX, offZ) {
  const wheel = new THREE.Group();
  wheel.position.set(x, 0.36, z);
  const spin = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.34, 48), mat.tire);
  tire.rotation.z = Math.PI / 2;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.36, 24), mat.rim);
  rim.rotation.z = Math.PI / 2;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.025, 8, 28), mat.chrome);
  ring.rotation.y = Math.PI / 2;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.38, 20), mat.cyan);
  hub.rotation.z = Math.PI / 2;
  const brake = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.12, 24), mat.brake);
  brake.rotation.z = Math.PI / 2;
  spin.add(tire, rim, ring, hub, brake);
  wheel.add(spin);
  wheel.userData.spin = spin;
  registerPart(name, wheel, new THREE.Vector3(offX, 0.35, offZ), new THREE.Vector3(0, 0.65, 0));
  return wheel;
}

// ---------- UI state ----------
const ui = {
  explode: document.getElementById('slider-explode'),
  speed: document.getElementById('slider-speed'),
  explodeValue: document.getElementById('explode-value'),
  speedValue: document.getElementById('speed-value'),
  btnExplode: document.getElementById('btn-explode'),
  btnAuto: document.getElementById('btn-auto'),
  btnWire: document.getElementById('btn-wire'),
  btnLabels: document.getElementById('btn-labels'),
  btnReset: document.getElementById('btn-reset'),
  partName: document.getElementById('part-name'),
  partDesc: document.getElementById('part-desc'),
  fps: document.getElementById('stat-fps'),
  loader: document.getElementById('loader')
};

let targetExplode = 0;
let currentExplode = 0;
let wireframe = false;
let labelsVisible = true;
let hovered = null;
let selectedName = null;
let activeHighlight = null;
let rotateSpeed = 1.0;

function setExplode(value) {
  targetExplode = THREE.MathUtils.clamp(value, 0, 1);
  ui.explode.value = Math.round(targetExplode * 100);
  ui.btnExplode.textContent = targetExplode < 0.05 ? '开始拆解' : '合体复原';
}

function updateParts(amount) {
  for (const part of parts) {
    part.position.copy(part.userData.basePos).addScaledVector(part.userData.explodeOffset, amount);
  }
}

function applyWireframe() {
  car.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if ('wireframe' in m) m.wireframe = wireframe;
    }
  });
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(999, 999);

function setPointer(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

function getHoveredName() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(partMeshes, false);
  for (const hit of hits) {
    const name = hit.object.userData.partName;
    if (name) return name;
  }
  return null;
}

function setHighlight(name, on) {
  const group = nameToGroup.get(name);
  if (!group) return;
  group.traverse((o) => {
    if (!o.isMesh || !o.material || o.material.emissive === undefined) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (on) {
        if (m.userData.prevHex === undefined) {
          m.userData.prevHex = m.emissive.getHex();
          m.userData.prevIntensity = m.emissiveIntensity;
        }
        m.emissive.set(0x00e5ff);
        m.emissiveIntensity = Math.max(m.emissiveIntensity, 0.55);
      } else if (m.userData.prevHex !== undefined) {
        m.emissive.setHex(m.userData.prevHex);
        m.emissiveIntensity = m.userData.prevIntensity;
        delete m.userData.prevHex;
        delete m.userData.prevIntensity;
      }
    }
  });
}

function updateHighlight() {
  const name = hovered || selectedName;
  if (name === activeHighlight) return;
  if (activeHighlight) setHighlight(activeHighlight, false);
  activeHighlight = name;
  if (activeHighlight) setHighlight(activeHighlight, true);
}

function refreshPartInfo() {
  const name = hovered || selectedName;
  ui.partName.textContent = name || '悬停零件查看信息';
  ui.partDesc.textContent = name ? partMeta[name] : '将鼠标移动到车体任意零件上，获取结构与材料说明。';
}

renderer.domElement.addEventListener('pointermove', (event) => {
  setPointer(event);
  const next = getHoveredName();
  if (next !== hovered) {
    hovered = next;
    updateHighlight();
    refreshPartInfo();
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  hovered = null;
  pointer.set(999, 999);
  updateHighlight();
  refreshPartInfo();
});

renderer.domElement.addEventListener('click', () => {
  const name = getHoveredName();
  selectedName = name && name !== selectedName ? name : null;
  updateHighlight();
  refreshPartInfo();
});

ui.explode.addEventListener('input', () => {
  setExplode(Number(ui.explode.value) / 100);
});
ui.btnExplode.addEventListener('click', () => {
  setExplode(targetExplode < 0.05 ? 0.72 : 0);
});
ui.speed.addEventListener('input', () => {
  rotateSpeed = Number(ui.speed.value);
  ui.speedValue.textContent = rotateSpeed.toFixed(1) + 'x';
});
ui.btnAuto.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  ui.btnAuto.classList.toggle('active', controls.autoRotate);
});
ui.btnWire.addEventListener('click', () => {
  wireframe = !wireframe;
  ui.btnWire.classList.toggle('active', wireframe);
  applyWireframe();
});
ui.btnLabels.addEventListener('click', () => {
  labelsVisible = !labelsVisible;
  ui.btnLabels.classList.toggle('active', labelsVisible);
  labelRenderer.domElement.style.display = labelsVisible ? 'block' : 'none';
});
ui.btnReset.addEventListener('click', () => {
  camera.position.set(7.4, 4.2, 10.4);
  controls.target.set(0, 0.62, 0);
  controls.update();
});

window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

// ---------- Animation loop ----------
const clock = new THREE.Clock();
let frames = 0;
let fpsClock = 0;
let lastExplodePercent = -1;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.1);
  currentExplode += (targetExplode - currentExplode) * Math.min(1, dt * 4.2);
  updateParts(currentExplode);

  const percent = Math.round(currentExplode * 100);
  if (percent !== lastExplodePercent) {
    ui.explodeValue.textContent = percent + '%';
    lastExplodePercent = percent;
  }

  for (const part of parts) {
    if (part.userData.spin) part.userData.spin.rotation.x += dt * 0.7;
  }

  particles.rotation.y += dt * 0.03;
  for (const ring of techRings) {
    ring.rotation.z += dt * (techRings.indexOf(ring) % 2 ? 0.1 : 0.18);
    if (Math.abs(ring.rotation.x - Math.PI / 2) < 0.01) ring.rotation.z += dt * 0.12;
  }

  controls.autoRotateSpeed = rotateSpeed;
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);

  frames++;
  fpsClock += dt;
  if (fpsClock >= 0.5) {
    ui.fps.textContent = Math.round(frames / fpsClock);
    frames = 0;
    fpsClock = 0;
  }
  requestAnimationFrame(animate);
}

setExplode(0);
updateParts(0);
refreshPartInfo();
setTimeout(() => {
  ui.loader.classList.add('hidden');
  setExplode(0.72);
}, 650);
animate();
</script>
